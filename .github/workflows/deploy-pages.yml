name: Deploy to GitHub Pages

# Публикует сайт на GitHub Pages: статический экспорт Next.js из site/out
# уходит в корень Pages — https://mary-rnd.github.io/surgery-landing/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /surgery-landing

      - name: Assemble Pages artifact
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -R site/out/. _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
